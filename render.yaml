services:
  - type: web
    name: mompulse-ml-backend
    env: python
    plan: free
    buildCommand: pip install -r ml-backend/requirements.txt
    startCommand: cd ml-backend && python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PORT
        value: 5000
      - key: PREGNANCY_PORT
        value: 5001
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
    healthCheckInterval: 30
    maxShutdownDelay: 30
